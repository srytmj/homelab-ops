services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: shared-postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: admin
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env, reused from the shared Postgres user
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}  # set in .env, generated once, never commit the real value
      N8N_PORT: "5678"
      GENERIC_TIMEZONE: Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - shared_net

volumes:
  n8n_data:

networks:
  shared_net:
    external: true

version: "3.9"

services:
  navidrome:
    image: deluan/navidrome
    container_name: navidrome
    restart: unless-stopped
    volumes:
      - /mnt/external-storage/music:/music
      - navidrome_data:/data
    ports:
      - "4533:4533"
    networks:
      - shared_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.navidrome.rule=Host(`music.yourdomain.dev`)"

volumes:
  navidrome_data:

networks:
  shared_net:
    external: true

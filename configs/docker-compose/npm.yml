version: "3.9"

services:
  npm:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP, proxied traffic
      - "443:443"   # HTTPS, proxied traffic
      - "81:81"     # Admin UI
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - shared_net

volumes:
  npm_data:
  npm_letsencrypt:

networks:
  shared_net:
    external: true

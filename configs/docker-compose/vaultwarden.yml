services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      WEBSOCKET_ENABLED: "true"
      SIGNUPS_ALLOWED: "true"  # set to false once accounts are created, per Vaultwarden's own recommendation
    volumes:
      - vaultwarden_data:/data
    ports:
      - "8222:80"
    networks:
      - shared_net

volumes:
  vaultwarden_data:

networks:
  shared_net:
    external: true

services:
  librespeed:
    image: lscr.io/linuxserver/librespeed:latest
    container_name: librespeed
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Jakarta
      PASSWORD: ""  # empty = no password on the results/admin page
    volumes:
      - librespeed_config:/config
    ports:
      - "8082:80"
    networks:
      - shared_net

volumes:
  librespeed_config:

networks:
  shared_net:
    external: true

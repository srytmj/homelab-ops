version: "3.9"

services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich-server
    restart: unless-stopped
    volumes:
      - /mnt/external-storage/immich:/usr/src/app/upload
    environment:
      DB_HOSTNAME: shared-postgres
      DB_USERNAME: admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: shared-redis
    ports:
      - "2283:2283"
    networks:
      - shared_net
    # Note: Immich includes ML for face/object detection — heaviest single service in the stack.
    # Consider a memory limit if it competes with other containers:
    # deploy:
    #   resources:
    #     limits:
    #       memory: 2G
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`photos.yourdomain.dev`)"

networks:
  shared_net:
    external: true

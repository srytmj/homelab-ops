version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: shared-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # set in .env, never commit the real value
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shared_net
    ports:
      - "127.0.0.1:5432:5432"  # bind to localhost only, not exposed externally

  redis:
    image: redis:7-alpine
    container_name: shared-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - shared_net
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
  redis_data:

networks:
  shared_net:
    external: true
